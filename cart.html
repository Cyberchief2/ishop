<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>iShop – Cart</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />

<!-- Open Graph / Social Share -->
<meta property="og:type" content="website" />
<meta property="og:title" content="iShop – Nigeria's #1 Online Store" />
<meta property="og:description" content="Shop electronics, fashion, beauty & digital products at unbeatable prices. Trusted by 500,000+ Nigerians." />
<meta property="og:image" content="https://ishop.com.ng/og-image.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:url" content="https://ishop.com.ng" />
<meta property="og:site_name" content="iShop" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="iShop – Nigeria's #1 Online Store" />
<meta name="twitter:description" content="Shop electronics, fashion, beauty & digital products at unbeatable prices." />
<meta name="twitter:image" content="https://ishop.com.ng/og-image.png" />
<meta name="description" content="iShop – Nigeria's #1 Online Store. Shop electronics, fashion, beauty & digital products at unbeatable prices." />
</head>
<body>
    <div id="site-header"></div>

    <!-- CART SECTION -->
    <section class="cart-page">
        <div class="cart-page-header">
            <h1>🛒 Your Shopping Cart</h1>
            <p id="cartTotalItems">0 items in your cart</p>
        </div>
        <div class="cart-layout">
            <div class="cart-items" id="cartItems"></div>
            <div class="cart-summary" id="cartSummary"></div>
        </div>
    </section>

    <div id="site-footer"></div>

    

    <!-- WhatsApp Floating Button -->
    <a href="https://wa.me/2348158339217?text=Hello%20iShop%2C%20I%20need%20help%20with%20an%20order"
       target="_blank"
       class="whatsapp-float"
       aria-label="Chat on WhatsApp">
        <i class="fab fa-whatsapp"></i>
    </a>

    <script src="script.js"></script>
</body>
</html>
