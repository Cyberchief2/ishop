<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Home & Kitchen – iShop</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
</head>
<body class="home-page">
    <div id="site-header"></div>

    <section class="page-header">
        <div class="page-header-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#f9c74f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
        </div>
        <h1>Home & Kitchen</h1>
        <p>Everything for your home — furniture, kitchenware, décor, bedding & more</p>
    </section>

    <section class="subcat-section">
        <div class="subcat-row">
            <button class="subcat-item active" data-subtype="all">
                <div class="subcat-icon"><span style="font-size:2rem;">🏠</span></div>
                <div class="subcat-label">All</div>
            </button>
            <button class="subcat-item" data-subtype="sofas">
                <div class="subcat-icon"><span style="font-size:2rem;">🛋️</span></div>
                <div class="subcat-label">Sofas</div>
            </button>
            <button class="subcat-item" data-subtype="beds">
                <div class="subcat-icon"><span style="font-size:2rem;">🛏️</span></div>
                <div class="subcat-label">Beds</div>
            </button>
            <button class="subcat-item" data-subtype="cookware">
                <div class="subcat-icon"><span style="font-size:2rem;">🍳</span></div>
                <div class="subcat-label">Cookware</div>
            </button>
            <button class="subcat-item" data-subtype="appliances">
                <div class="subcat-icon"><span style="font-size:2rem;">🔌</span></div>
                <div class="subcat-label">Appliances</div>
            </button>
            <button class="subcat-item" data-subtype="bedding">
                <div class="subcat-icon"><span style="font-size:2rem;">🛌</span></div>
                <div class="subcat-label">Bedding</div>
            </button>
            <button class="subcat-item" data-subtype="decor">
                <div class="subcat-icon"><span style="font-size:2rem;">🎨</span></div>
                <div class="subcat-label">Décor</div>
            </button>
        </div>
    </section>

    <section class="featured-products">
        <div class="product-grid" id="homeProducts"></div>
    </section>

    <div id="site-footer"></div>
    <script src="script.js"></script>
</body>
</html>
