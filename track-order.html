<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Track Your Order – iShop</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Track Your Order – iShop" />
    <meta property="og:description" content="Check the status of your iShop order in real time." />
    <meta property="og:image" content="https://ishop.com.ng/og-image.png" />
    <meta property="og:url" content="https://ishop.com.ng/track-order.html" />
    <meta name="description" content="Track your iShop order in real time." />
</head>
<body>
    <div id="site-header"></div>

    <!-- PAGE HEADER -->
    <section class="track-header">
        <div class="track-header-icon">
            <i class="fas fa-box-open"></i>
        </div>
        <h1>Track Your Order</h1>
        <p>Enter your order reference to see real-time delivery status</p>
    </section>

    <!-- TRACKING FORM -->
    <section class="track-container">
        <div class="track-form-card">
            <div class="track-input-row">
                <input
                    type="text"
                    id="trackReferenceInput"
                    class="track-input"
                    placeholder="e.g. T828989858942451"
                    autocomplete="off"
                    spellcheck="false"
                />
                <button id="trackBtn" class="track-btn" onclick="iShopTrackOrder()">
                    <i class="fas fa-search"></i>
                    <span>Track</span>
                </button>
            </div>
            <p class="track-hint">
                <i class="fas fa-info-circle"></i>
                Your order reference starts with <strong>T</strong> — find it in your confirmation email or the order-confirmed page.
            </p>
        </div>

        <!-- RESULT CONTAINER — populated by JS -->
        <div id="trackResult" class="track-result-wrap"></div>
    </section>

    <div id="site-footer"></div>

    <!-- WhatsApp Floating Button -->
    <a href="https://wa.me/2348158339217?text=Hello%20iShop%2C%20I%20need%20help%20with%20an%20order"
       target="_blank"
       class="whatsapp-float"
       aria-label="Chat on WhatsApp">
        <i class="fab fa-whatsapp"></i>
    </a>

    <script src="shipping.js"></script>
    <script src="script.js"></script>
</body>
</html>
