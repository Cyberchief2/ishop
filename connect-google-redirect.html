<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Signing you in...</title>
    <style>
        body { font-family: 'Inter', -apple-system, sans-serif; background: #0d1b2a; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; text-align: center; padding: 2rem; }
        .box { max-width: 500px; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(249, 199, 79, 0.2); border-top-color: #f9c74f; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1.5rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: #8a9aa8; font-size: 0.95rem; }
        .error { color: #ff6b6b; }
        .debug { background: rgba(255,255,255,0.05); padding: 1rem; border-radius: 8px; margin-top: 1.5rem; font-size: 0.75rem; color: #8a9aa8; text-align: left; word-break: break-all; }
    </style>
</head>
<body>
    <div class="box">
        <div class="spinner" id="spinner"></div>
        <h1 id="title">Signing you in…</h1>
        <p id="message">Please wait while we verify your Google account.</p>
        <div id="debug" class="debug" style="display:none;"></div>
    </div>
    <script>
        const STRAPI_URL = 'https://ishop-cms-production.up.railway.app';

        // ============================================
        // Robust token extraction — handles every format
        // ============================================
        function extractAccessToken() {
            const search = window.location.search;
            const hash = window.location.hash;
            const full = search + hash;

            // Method 1: raw[access_token] pattern (Strapi 5 default)
            let match = full.match(/raw\[access_token\]=([^&]+)/);
            if (match) return decodeURIComponent(match[1]);

            // Method 2: access_token plain
            match = full.match(/[?&#]access_token=([^&]+)/);
            if (match) return decodeURIComponent(match[1]);

            // Method 3: URLSearchParams (handles URL-encoded brackets)
            const params = new URLSearchParams(search);
            const direct = params.get('access_token') || params.get('raw[access_token]');
            if (direct) return direct;

            // Method 4: raw as JSON
            const raw = params.get('raw');
            if (raw) {
                try {
                    const parsed = JSON.parse(decodeURIComponent(raw));
                    return parsed.access_token || null;
                } catch (e) {}
            }

            return null;
        }

        const accessToken = extractAccessToken();

        const titleEl = document.getElementById('title');
        const messageEl = document.getElementById('message');
        const spinnerEl = document.getElementById('spinner');
        const debugEl = document.getElementById('debug');

        // Show debug info briefly
        debugEl.style.display = 'block';
        debugEl.textContent = 'URL: ' + window.location.href.substring(0, 200) + '...\nToken found: ' + (accessToken ? 'YES' : 'NO');

        if (!accessToken) {
            spinnerEl.style.display = 'none';
            titleEl.textContent = 'Login failed';
            titleEl.className = 'error';
            messageEl.textContent = 'No access token received. Redirecting to login…';
            setTimeout(() => window.location.href = 'login.html', 3000);
        } else {
            fetch(`${STRAPI_URL}/api/auth/google/callback?access_token=${encodeURIComponent(accessToken)}`)
                .then(async res => {
                    const data = await res.json();
                    if (!res.ok) {
                        throw new Error(data?.error?.message || `HTTP ${res.status}`);
                    }
                    return data;
                })
                .then(data => {
                    if (data.jwt && data.user) {
                        localStorage.setItem('iShopJwt', data.jwt);
                        localStorage.setItem('iShopUser', JSON.stringify({
                            id: data.user.id,
                            documentId: data.user.documentId,
                            username: data.user.username,
                            email: data.user.email,
                            fullName: data.user.username || data.user.email,
                            phone: data.user.phone || '',
                            address: data.user.address || '',
                            provider: data.user.provider || 'google'
                        }));
                        if (data.refreshToken) localStorage.setItem('iShopRefreshToken', data.refreshToken);

                        titleEl.textContent = 'Welcome!';
                        messageEl.textContent = 'Redirecting to your profile…';
                        setTimeout(() => window.location.href = 'profile.html', 800);
                    } else {
                        throw new Error('No JWT in response');
                    }
                })
                .catch(err => {
                    console.error('Google login error:', err);
                    spinnerEl.style.display = 'none';
                    titleEl.textContent = 'Login failed';
                    titleEl.className = 'error';
                    messageEl.textContent = 'Could not complete sign in. Redirecting to login…';
                    debugEl.textContent += '\n\nError: ' + err.message;
                    setTimeout(() => window.location.href = 'login.html', 3000);
                });
        }
    </script>
</body>
</html>
