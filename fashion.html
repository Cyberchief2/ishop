<!DOCTYPE html>
<html lang="en" class="category-page">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>iShop – Fashion</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />

<!-- Open Graph / Social Share -->
<meta property="og:type" content="website" />
<meta property="og:title" content="iShop – Nigeria's #1 Online Store" />
<meta property="og:description" content="Shop electronics, fashion, beauty & digital products at unbeatable prices. Trusted by 500,000+ Nigerians." />
<meta property="og:image" content="https://ishop.com.ng/og-image.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:url" content="https://ishop.com.ng" />
<meta property="og:site_name" content="iShop" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="iShop – Nigeria's #1 Online Store" />
<meta name="twitter:description" content="Shop electronics, fashion, beauty & digital products at unbeatable prices." />
<meta name="twitter:image" content="https://ishop.com.ng/og-image.png" />
<meta name="description" content="iShop – Nigeria's #1 Online Store. Shop electronics, fashion, beauty & digital products at unbeatable prices." />
</head>
<body>
    <div id="site-header"></div>

    <section class="page-header">
        <div class="page-header-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4H6z" fill="#f9c74f"/>
                <path d="M3 6h18" stroke="#0d1b2a" stroke-width="2" stroke-linecap="round"/>
                <path d="M16 10a4 4 0 01-8 0" stroke="#0d1b2a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <h1>Fashion</h1>
        <p>Clothing, shoes, bags & accessories</p>
    </section>

    <section class="subcat-section">
        <div class="subcat-row">
            <button class="subcat-item active" data-subtype="all">
                <div class="subcat-icon"><img src="images/categories/all-fashion.jpg" alt="All" /></div>
                <span class="subcat-label">All</span>
            </button>
            <button class="subcat-item" data-subtype="clothing">
                <div class="subcat-icon"><img src="images/categories/clothing.jpg" alt="Clothing" /></div>
                <span class="subcat-label">Clothing</span>
            </button>
            <button class="subcat-item" data-subtype="traditional">
                <div class="subcat-icon"><img src="images/categories/traditional.jpg" alt="Traditional" /></div>
                <span class="subcat-label">Traditional</span>
            </button>
            <button class="subcat-item" data-subtype="shoes">
                <div class="subcat-icon"><img src="images/categories/shoes.jpg" alt="Shoes" /></div>
                <span class="subcat-label">Shoes</span>
            </button>
            <button class="subcat-item" data-subtype="bags">
                <div class="subcat-icon"><img src="images/categories/bags.jpg" alt="Bags" /></div>
                <span class="subcat-label">Bags</span>
            </button>
            <button class="subcat-item" data-subtype="jewelry">
                <div class="subcat-icon"><img src="images/categories/jewelry.jpg" alt="Jewelry" /></div>
                <span class="subcat-label">Jewelry</span>
            </button>
            <button class="subcat-item" data-subtype="accessories">
                <div class="subcat-icon"><img src="images/categories/fashion-accessories.jpg" alt="Accessories" /></div>
                <span class="subcat-label">Accessories</span>
            </button>
        </div>
    </section>

    <section class="featured-products">
        <div class="product-grid" id="fashionProducts"></div>
    </section>

    <div id="site-footer"></div>

    

    <script src="script.js"></script>
</body>
</html>
