<!DOCTYPE html>
<html lang="en" class="category-page">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>iShop – Electronics</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />

<!-- Open Graph / Social Share -->
<meta property="og:type" content="website" />
<meta property="og:title" content="iShop – Nigeria's #1 Online Store" />
<meta property="og:description" content="Shop electronics, fashion, beauty & digital products at unbeatable prices. Trusted by 500,000+ Nigerians." />
<meta property="og:image" content="https://ishop.com.ng/og-image.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:url" content="https://ishop.com.ng" />
<meta property="og:site_name" content="iShop" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="iShop – Nigeria's #1 Online Store" />
<meta name="twitter:description" content="Shop electronics, fashion, beauty & digital products at unbeatable prices." />
<meta name="twitter:image" content="https://ishop.com.ng/og-image.png" />
<meta name="description" content="iShop – Nigeria's #1 Online Store. Shop electronics, fashion, beauty & digital products at unbeatable prices." />
</head>
<body>
    <div id="site-header"></div>

    <section class="page-header">
        <div class="page-header-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="6" y="2" width="12" height="20" rx="2" fill="#0d1b2a"/>
                <rect x="8" y="4" width="8" height="14" fill="#f9c74f"/>
                <circle cx="12" cy="20" r="1" fill="#f9c74f"/>
            </svg>
        </div>
        <h1>Electronics</h1>
        <p>Phones, laptops, audio & more</p>
    </section>

    <section class="subcat-section">
        <div class="subcat-row">
            <button class="subcat-item active" data-subtype="all">
                <div class="subcat-icon"><img src="images/categories/all-electronics.jpg" alt="All" /></div>
                <span class="subcat-label">All</span>
            </button>
            <button class="subcat-item" data-subtype="smartphones">
                <div class="subcat-icon"><img src="images/categories/smartphones.jpg" alt="Phones" /></div>
                <span class="subcat-label">Phones</span>
            </button>
            <button class="subcat-item" data-subtype="laptops">
                <div class="subcat-icon"><img src="images/categories/laptops.jpg" alt="Laptops" /></div>
                <span class="subcat-label">Laptops</span>
            </button>
            <button class="subcat-item" data-subtype="audio">
                <div class="subcat-icon"><img src="images/categories/audio.jpg" alt="Audio" /></div>
                <span class="subcat-label">Audio</span>
            </button>
            <button class="subcat-item" data-subtype="tv">
                <div class="subcat-icon"><img src="images/categories/tv.jpg" alt="TVs" /></div>
                <span class="subcat-label">TVs</span>
            </button>
            <button class="subcat-item" data-subtype="wearables">
                <div class="subcat-icon"><img src="images/categories/wearables.jpg" alt="Wearables" /></div>
                <span class="subcat-label">Wearables</span>
            </button>
            <button class="subcat-item" data-subtype="accessories">
                <div class="subcat-icon"><img src="images/categories/accessories.jpg" alt="Accessories" /></div>
                <span class="subcat-label">Accessories</span>
            </button>
        </div>
    </section>

    <section class="featured-products">
        <div class="product-grid" id="electronicsProducts"></div>
    </section>

    <div id="site-footer"></div>

    

    <script src="script.js"></script>
</body>
</html>
