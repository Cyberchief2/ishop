<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>iShop – All Products</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />

<!-- Open Graph / Social Share -->
<meta property="og:type" content="website" />
<meta property="og:title" content="iShop – Nigeria's #1 Online Store" />
<meta property="og:description" content="Shop electronics, fashion, beauty & digital products at unbeatable prices. Trusted by 500,000+ Nigerians." />
<meta property="og:image" content="https://ishop.com.ng/og-image.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:url" content="https://ishop.com.ng" />
<meta property="og:site_name" content="iShop" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="iShop – Nigeria's #1 Online Store" />
<meta name="twitter:description" content="Shop electronics, fashion, beauty & digital products at unbeatable prices." />
<meta name="twitter:image" content="https://ishop.com.ng/og-image.png" />
<meta name="description" content="iShop – Nigeria's #1 Online Store. Shop electronics, fashion, beauty & digital products at unbeatable prices." />
</head>
<body>
    <div id="site-header"></div>

    <!-- PAGE HEADER -->
    <section class="page-header">
        <h1>All Products</h1>
        <p>Browse our complete collection across every category</p>
    </section>

    <!-- FILTER TABS -->
    <section class="digital-categories">
        <div class="digital-tabs">
            <button class="tab-btn active" data-type="all">All</button>
            <button class="tab-btn" data-type="electronics">📱 Electronics</button>
            <button class="tab-btn" data-type="fashion">👗 Fashion</button>
            <button class="tab-btn" data-type="beauty">💄 Beauty</button>
            <button class="tab-btn" data-type="digital">💻 Digital</button>
        </div>
    </section>

    <!-- RESULTS BAR -->
    <div class="results-bar">
        <div class="inline-search">
            <input type="text" id="shopSearch" placeholder="Search products..." />
            <button onclick="filterBySearch()"><i class="fas fa-search"></i></button>
        </div>
        <div class="results-count">
            Showing <strong id="resultsCount">0</strong> products
        </div>
    </div>

    <!-- FILTER TOOLBAR -->
    <section class="shop-filter-toolbar">
        <div class="shop-filter-toolbar-inner">
            <div class="shop-filter-group">
                <label for="shopSortSelect">Sort by</label>
                <select id="shopSortSelect">
                    <option value="newest">Newest</option>
                    <option value="price-asc">Price: Low to High</option>
                    <option value="price-desc">Price: High to Low</option>
                    <option value="rating">Top Rated</option>
                    <option value="name">Name: A → Z</option>
                </select>
            </div>

            <div class="shop-filter-group">
                <label>Price range</label>
                <div class="shop-price-inputs">
                    <input type="number" id="shopPriceMin" placeholder="Min ₦" min="0" />
                    <span>–</span>
                    <input type="number" id="shopPriceMax" placeholder="Max ₦" min="0" />
                </div>
                <div class="shop-price-quick">
                    <button class="price-quick-chip" data-min="" data-max="10000">Under ₦10k</button>
                    <button class="price-quick-chip" data-min="10000" data-max="50000">₦10k–50k</button>
                    <button class="price-quick-chip" data-min="50000" data-max="200000">₦50k–200k</button>
                    <button class="price-quick-chip" data-min="200000" data-max="">Over ₦200k</button>
                </div>
            </div>

            <div class="shop-filter-group">
                <label for="shopRatingSelect">Rating</label>
                <select id="shopRatingSelect">
                    <option value="0">Any rating</option>
                    <option value="4">4★ &amp; up</option>
                    <option value="3">3★ &amp; up</option>
                    <option value="2">2★ &amp; up</option>
                </select>
            </div>
        </div>

        <div id="activeFilterChips"></div>
    </section>

    <!-- PRODUCT GRID — populated by script.js -->
    <section class="featured-products">
        <div class="product-grid" id="allProductsGrid"></div>
    </section>

    <div id="site-footer"></div>

    

    <!-- WhatsApp Floating Button -->
    <a href="https://wa.me/2348158339217?text=Hello%20iShop%2C%20I%20need%20help%20with%20an%20order"
       target="_blank"
       class="whatsapp-float"
       aria-label="Chat on WhatsApp">
        <i class="fab fa-whatsapp"></i>
    </a>

    <script src="script.js"></script>
</body>
</html>
