<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>iShop – Checkout</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Social Share -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="iShop – Nigeria's #1 Online Store" />
    <meta property="og:description" content="Shop electronics, fashion, beauty & digital products at unbeatable prices. Trusted by 500,000+ Nigerians." />
    <meta property="og:image" content="https://ishop.com.ng/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://ishop.com.ng" />
    <meta property="og:site_name" content="iShop" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="iShop – Nigeria's #1 Online Store" />
    <meta name="twitter:description" content="Shop electronics, fashion, beauty & digital products at unbeatable prices." />
    <meta name="twitter:image" content="https://ishop.com.ng/og-image.png" />
    <meta name="description" content="iShop – Nigeria's #1 Online Store. Shop electronics, fashion, beauty & digital products at unbeatable prices." />
    <script src="https://js.paystack.co/v2/inline.js"></script>
</head>
<body>
    <div id="site-header"></div>

    <!-- CHECKOUT HEADER -->
    <section class="checkout-header">
        <h1>Checkout</h1>
        <p>Complete your order — safe and secure</p>
    </section>

    <!-- CHECKOUT FORM + SUMMARY -->
    <section class="checkout-wrapper">
        <!-- LEFT: FORM -->
        <div class="checkout-form">
            <h3><i class="fas fa-truck" style="color:#f9c74f;margin-right:0.5rem;"></i> Shipping Information</h3>
            <form id="checkoutForm">
                <div class="form-group">
                    <label for="fullName">Full Name *</label>
                    <input type="text" id="fullName" placeholder="John Doe" required />
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" placeholder="john@example.com" required />
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone *</label>
                        <input type="tel" id="phone" placeholder="08012345678" required />
                    </div>
                </div>

                <!-- Toggle: ship to different address -->
                <div class="form-group">
                    <label class="checkbox-row">
                        <input type="checkbox" id="differentShipping" onchange="toggleDifferentShipping()" />
                        <span><i class="fas fa-truck" style="color:#f9c74f;"></i> Ship to a different address</span>
                    </label>
                </div>

                <!-- ============================================ -->
                <!-- DEFAULT SHIPPING (recipient = customer) -->
                <!-- ============================================ -->
                <div id="defaultShippingFields">
                    <div class="form-group">
                        <label for="address">Delivery Address *</label>
                        <textarea id="address" rows="3" placeholder="House number, street, city" required></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="state">Delivery State *</label>
                            <select id="state" required onchange="updateLGAs(this.value)">
                                <option value="">Select your state</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="lga">Local Government Area (LGA) *</label>
                            <select id="lga" required onchange="onLgaChange()" disabled>
                                <option value="">Select state first</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- ============================================ -->
                <!-- DIFFERENT SHIPPING (recipient ≠ customer) -->
                <!-- ============================================ -->
                <div id="differentShippingFields" style="display: none;">
                    <div class="different-shipping-header">
                        <i class="fas fa-map-marker-alt"></i>
                        <span>Shipping to a different address</span>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="shipName">Recipient Name *</label>
                            <input type="text" id="shipName" placeholder="Full name of recipient" />
                        </div>
                        <div class="form-group">
                            <label for="shipPhone">Recipient Phone *</label>
                            <input type="tel" id="shipPhone" placeholder="08012345678" />
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="shipAddress">Delivery Address *</label>
                        <textarea id="shipAddress" rows="3" placeholder="House number, street, city"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="shipState">Recipient's State *</label>
                            <select id="shipState" onchange="updateShipLGAs(this.value)">
                                <option value="">Select recipient's state</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="shipLga">Recipient's LGA *</label>
                            <select id="shipLga" disabled onchange="onLgaChange()">
                                <option value="">Select state first</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="shipNotes">Delivery Notes (optional)</label>
                        <input type="text" id="shipNotes" placeholder="e.g., Call before delivery, gate code, landmark" />
                    </div>
                </div>

                <div class="form-group">
                    <label for="payment">Payment Method *</label>
                    <select id="payment" required>
                        <option value="paystack">💳 Paystack (Card / Bank / USSD)</option>
                        <option value="transfer">🏦 Bank Transfer</option>
                        <option value="cod">💵 Cash on Delivery</option>
                    </select>
                </div>
                <div id="paymentInfo" class="payment-info">
                    <i class="fas fa-lock" style="color:#4CAF50;"></i>
                    <span>Your payment is secured by Paystack. You'll be redirected to complete payment after clicking Place Order.</span>
                </div>
                <button type="submit" class="btn-primary" id="placeOrderBtn">
                    <i class="fas fa-lock"></i> Place Order & Pay Securely
                </button>
            </form>
            <div id="orderFeedback"></div>
        </div>

        <!-- RIGHT: SUMMARY -->
        <div class="order-summary" id="orderSummary"></div>
    </section>

    <div id="site-footer"></div>

    <!-- WhatsApp Floating Button -->
    <a href="https://wa.me/2348114808088?text=Hello%20iShop%2C%20I%20need%20help%20with%20an%20order"
       target="_blank"
       class="whatsapp-float"
       aria-label="Chat on WhatsApp">
        <i class="fab fa-whatsapp"></i>
    </a>

    <!-- ============================================ -->
    <!-- SCRIPTS — shipping.js MUST come before script.js -->
    <!-- ============================================ -->
    <script src="shipping.js"></script>
    <script src="script.js"></script>
</body>
</html>
