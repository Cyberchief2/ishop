<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>iShop – Forgot Password</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body>
    <section class="auth-section">
        <div class="auth-wrapper">
            <div class="auth-form-container">
                <div class="auth-form-card">
                    <div class="auth-brand">
                        <span class="brand-icon">🔒</span>
                        <h2>Forgot Password?</h2>
                        <p>Enter your email and we'll send you a reset link</p>
                    </div>

                    <form id="forgotForm">
                        <div class="form-group">
                            <label for="forgotEmail">Email Address</label>
                            <div class="input-wrapper">
                                <i class="fas fa-envelope"></i>
                                <input type="email" id="forgotEmail" placeholder="Enter your email" required />
                            </div>
                        </div>

                        <button type="submit" class="btn-auth">
                            <i class="fas fa-paper-plane"></i> Send Reset Link
                        </button>
                    </form>

                    <div id="forgotFeedback" style="margin-top:1rem;"></div>

                    <div class="auth-footer" style="margin-top:1.5rem;">
                        <p>Remembered it? <a href="login.html">Back to Login</a></p>
                    </div>
                </div>
            </div>

            <div class="auth-hero">
                <div class="auth-hero-content">
                    <div class="auth-hero-badge"><i class="fas fa-shield-alt"></i> Secure Recovery</div>
                    <h2>Reset Your <br /><span>Password</span></h2>
                    <p>We'll send you a secure link to reset your password. The link expires in 1 hour for your safety.</p>
                </div>
            </div>
        </div>
    </section>

    <script>
        const STRAPI_URL = 'https://ishop-cms-production.up.railway.app';

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('forgotEmail').value.trim();
            const feedback = document.getElementById('forgotFeedback');

            if (!email) {
                feedback.className = 'error';
                feedback.innerHTML = '⚠️ Please enter your email.';
                return;
            }

            feedback.className = '';
            feedback.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending reset link…';

            try {
                const res = await fetch(`${STRAPI_URL}/api/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                // Strapi always returns 200 for forgot-password to prevent user enumeration
                feedback.className = 'success';
                feedback.innerHTML = `✅ If an account exists for <strong>${email}</strong>, a reset link has been sent. Check your inbox (and spam folder).`;
                document.getElementById('forgotForm').reset();

            } catch (err) {
                console.error('Forgot password error:', err);
                feedback.className = 'error';
                feedback.innerHTML = '❌ Could not connect to the server. Please try again.';
            }
        });
    </script>
</body>
</html>
