<!DOCTYPE html>
<html lang="en" class="category-page beauty-page">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>iShop – Beauty</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />

<!-- Open Graph / Social Share -->
<meta property="og:type" content="website" />
<meta property="og:title" content="iShop – Nigeria's #1 Online Store" />
<meta property="og:description" content="Shop electronics, fashion, beauty & digital products at unbeatable prices. Trusted by 500,000+ Nigerians." />
<meta property="og:image" content="https://ishop.com.ng/og-image.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:url" content="https://ishop.com.ng" />
<meta property="og:site_name" content="iShop" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="iShop – Nigeria's #1 Online Store" />
<meta name="twitter:description" content="Shop electronics, fashion, beauty & digital products at unbeatable prices." />
<meta name="twitter:image" content="https://ishop.com.ng/og-image.png" />
<meta name="description" content="iShop – Nigeria's #1 Online Store. Shop electronics, fashion, beauty & digital products at unbeatable prices." />
</head>
<body>
    <div id="site-header"></div>

    <section class="page-header">
        <div class="page-header-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2l2.09 6.26L20 9l-4.9 4.09L17.18 22 12 18.27 6.82 22l2.08-8.91L4 9l5.91-.74L12 2z" fill="#f9c74f"/>
            </svg>
        </div>
        <h1>Beauty</h1>
        <p>Skincare, makeup, fragrances & hair care</p>
    </section>

    <section class="subcat-section">
        <div class="subcat-row">
            <button class="subcat-item active" data-subtype="all">
                <div class="subcat-icon"><img src="images/categories/all-beauty.jpg" alt="All" /></div>
                <span class="subcat-label">All</span>
            </button>
            <button class="subcat-item" data-subtype="skincare">
                <div class="subcat-icon"><img src="images/categories/skincare.jpg" alt="Skincare" /></div>
                <span class="subcat-label">Skincare</span>
            </button>
            <button class="subcat-item" data-subtype="makeup">
                <div class="subcat-icon"><img src="images/categories/makeup.jpg" alt="Makeup" /></div>
                <span class="subcat-label">Makeup</span>
            </button>
            <button class="subcat-item" data-subtype="fragrances">
                <div class="subcat-icon"><img src="images/categories/fragrances.jpg" alt="Fragrances" /></div>
                <span class="subcat-label">Fragrances</span>
            </button>
            <button class="subcat-item" data-subtype="haircare">
                <div class="subcat-icon"><img src="images/categories/haircare.jpg" alt="Hair Care" /></div>
                <span class="subcat-label">Hair Care</span>
            </button>
        </div>
    </section>

    <section class="featured-products">
        <div class="product-grid" id="beautyProducts"></div>
    </section>

    <div id="site-footer"></div>

    

    <script src="script.js"></script>
</body>
</html>
