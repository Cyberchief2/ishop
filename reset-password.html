<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>iShop – Reset Password</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body>
    <section class="auth-section">
        <div class="auth-wrapper">
            <div class="auth-form-container">
                <div class="auth-form-card">
                    <div class="auth-brand">
                        <span class="brand-icon">🔑</span>
                        <h2>Set New Password</h2>
                        <p>Choose a strong password for your account</p>
                    </div>

                    <form id="resetForm">
                        <div class="form-group">
                            <label for="newPassword">New Password</label>
                            <div class="input-wrapper">
                                <i class="fas fa-lock"></i>
                                <input type="password" id="newPassword" placeholder="Min 6 characters" required minlength="6" />
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="confirmNewPassword">Confirm New Password</label>
                            <div class="input-wrapper">
                                <i class="fas fa-check-circle"></i>
                                <input type="password" id="confirmNewPassword" placeholder="Repeat password" required />
                            </div>
                        </div>

                        <button type="submit" class="btn-auth">
                            <i class="fas fa-check"></i> Reset Password
                        </button>
                    </form>

                    <div id="resetFeedback" style="margin-top:1rem;"></div>

                    <div class="auth-footer" style="margin-top:1.5rem;">
                        <p>Back to <a href="login.html">Login</a></p>
                    </div>
                </div>
            </div>

            <div class="auth-hero">
                <div class="auth-hero-content">
                    <div class="auth-hero-badge"><i class="fas fa-check-circle"></i> Almost There</div>
                    <h2>Set Your <br /><span>New Password</span></h2>
                    <p>Choose a password you haven't used before. Minimum 6 characters.</p>
                </div>
            </div>
        </div>
    </section>

    <script>
        const STRAPI_URL = 'https://ishop-cms-production.up.railway.app';
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');

        const feedback = document.getElementById('resetFeedback');

        if (!code) {
            feedback.className = 'error';
            feedback.innerHTML = '❌ Invalid or missing reset link. Please request a new one from the <a href="forgot-password.html">forgot password page</a>.';
            document.getElementById('resetForm').style.display = 'none';
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmNewPassword').value;

            if (password !== confirm) {
                feedback.className = 'error';
                feedback.innerHTML = '⚠️ Passwords do not match!';
                return;
            }
            if (password.length < 6) {
                feedback.className = 'error';
                feedback.innerHTML = '⚠️ Password must be at least 6 characters.';
                return;
            }

            feedback.className = '';
            feedback.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting password…';

            try {
                const res = await fetch(`${STRAPI_URL}/api/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        code: code,
                        password: password,
                        passwordConfirmation: confirm
                    })
                });

                const data = await res.json();

                if (!res.ok || !data.jwt) {
                    const msg = data?.error?.message || 'Reset link may have expired.';
                    feedback.className = 'error';
                    feedback.innerHTML = `❌ ${msg} <a href="forgot-password.html">Request a new link</a>`;
                    return;
                }

                feedback.className = 'success';
                feedback.innerHTML = '✅ Password reset! Redirecting to login…';

                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);

            } catch (err) {
                console.error('Reset error:', err);
                feedback.className = 'error';
                feedback.innerHTML = '❌ Could not connect to the server. Please try again.';
            }
        });
    </script>
</body>
</html>
