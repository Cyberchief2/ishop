<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Phones & Tablets – iShop</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
</head>
<body class="category-page">
    <div id="site-header"></div>

    <section class="page-header">
        <div class="page-header-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="6" y="2" width="12" height="20" rx="2" fill="#0d1b2a"/>
                <rect x="8" y="4" width="8" height="14" fill="#f9c74f"/>
                <circle cx="12" cy="20" r="1" fill="#f9c74f"/>
            </svg>
        </div>
        <h1>Phones & Tablets</h1>
        <p>Smartphones, tablets, accessories & power banks</p>
    </section>

    <section class="subcat-section">
        <div class="subcat-row">
            <button class="subcat-item active" data-subtype="all">
                <div class="subcat-icon"><i class="fas fa-th-large" style="font-size:1.4rem;color:#0d1b2a;"></i></div>
                <span class="subcat-label">All</span>
            </button>
            <button class="subcat-item" data-subtype="smartphones">
                <div class="subcat-icon"><i class="fas fa-mobile-alt" style="font-size:1.4rem;color:#0d1b2a;"></i></div>
                <span class="subcat-label">Smartphones</span>
            </button>
            <button class="subcat-item" data-subtype="tablets">
                <div class="subcat-icon"><i class="fas fa-tablet-alt" style="font-size:1.4rem;color:#0d1b2a;"></i></div>
                <span class="subcat-label">Tablets</span>
            </button>
            <button class="subcat-item" data-subtype="phone-accessories">
                <div class="subcat-icon"><i class="fas fa-plug" style="font-size:1.4rem;color:#0d1b2a;"></i></div>
                <span class="subcat-label">Accessories</span>
            </button>
            <button class="subcat-item" data-subtype="power-banks">
                <div class="subcat-icon"><i class="fas fa-battery-full" style="font-size:1.4rem;color:#0d1b2a;"></i></div>
                <span class="subcat-label">Power Banks</span>
            </button>
        </div>
    </section>

    <section class="featured-products">
        <div class="product-grid" id="phonesTabletsProducts"></div>
    </section>

    <div id="site-footer"></div>
    <script src="script.js"></script>
</body>
</html>
